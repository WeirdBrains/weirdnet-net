[package]
name = "weirdnet-net"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet networking: a libp2p node (TCP, QUIC, Noise, Yamux, mDNS, Kademlia, relays, hole punching, AutoNAT) carrying the application's own request and response types, signed key-exchange offers and answers with short codes, invitation tokens and links, sealed exchange messaging, node identities, user certificates and cards, under versioned identifier profiles."
authors = ["m3talsmith <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-net"
documentation = "https://docs.rs/weirdnet-net"
readme = "README.md"
keywords = ["p2p", "libp2p", "key-exchange", "invitation", "decentralized"]
categories = ["network-programming"]
include = ["src/**", "README.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tracing = "0.1"
futures = "0.3"
rustls-pki-types = { version = "1.12", features = ["std"] }
blake3 = "1.8"
hickory-resolver = "0.26"
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "mdns", "kad", "identify", "ping", "relay", "dcutr", "autonat", "request-response", "websocket", "cbor", "macros", "ed25519"] }
# every derivation, seal and open goes through the keys crate
weirdnet-keys = { version = "0.1.0", default-features = false }
chacha20poly1305 = "0.10"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
